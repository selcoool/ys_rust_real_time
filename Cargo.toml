


[package]
name = "ys_rust_real_time"
version = "0.1.0"
edition = "2024"


[dependencies]

actix-web = "4"
actix = "0.13"
actix-web-actors = "4"

tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "mysql",
    "macros"
] }
